name: CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - 'feat/**'

permissions:
  contents: read

# A newer push to the same pull-request branch cancels the stale run.
# Runs on main are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  audit:
    name: Security audit
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # The audit scans all reachable history, so it needs a full clone.
          fetch-depth: 0

      - name: Audit repository and reachable history for credentials
        run: |
          python3 scripts/security-audit.py --self-test
          python3 scripts/security-audit.py --output TestResults/security-audit.csv

      - name: Check integration test shard coverage
        run: python3 scripts/ci/check-test-shards.py

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-audit
          path: |
            TestResults/security-audit.csv
            TestResults/security-audit.txt
          if-no-files-found: ignore

  build-unit:
    name: Build and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore EnglishLearningPlatform.sln

      - name: Record tested candidate
        run: |
          mkdir -p TestResults
          git rev-parse HEAD > TestResults/candidate-sha.txt
          dotnet --version > TestResults/sdk-version.txt

      - name: Build solution
        run: dotnet build EnglishLearningPlatform.sln --configuration Release --no-restore

      - name: Run unit tests
        run: >
          dotnet test
          tests/EnglishLearningPlatform.UnitTests/EnglishLearningPlatform.UnitTests.csproj
          --configuration Release
          --no-build
          --logger "trx;LogFileName=unit-tests.trx"
          --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-unit
          path: |
            TestResults/*.trx
            TestResults/*-sha.txt
            TestResults/sdk-version.txt
          if-no-files-found: ignore

  integration:
    name: Integration tests (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 1
            filter: "FullyQualifiedName~TeacherPracticeQueryServiceTests|FullyQualifiedName~LearningDashboardFeatureTests|FullyQualifiedName~TeacherPracticeCreationTests|FullyQualifiedName~ProfileAndLoginTests|FullyQualifiedName~TeacherAssessmentConfigurationTests|FullyQualifiedName~AssessmentLifecycleAcceptanceTests|FullyQualifiedName~TeacherAssessmentScopeTests|FullyQualifiedName~TeacherAssessmentPreviewTests|FullyQualifiedName~AdversarialRoleNavigationStressTests|FullyQualifiedName~TeacherPracticeQuestionsTests|FullyQualifiedName~CheckoutFeatureTests|FullyQualifiedName~LearningCommerceJourneyTests|FullyQualifiedName~AuthorizationIntegrityAcceptanceTests|FullyQualifiedName~EnrollmentProgressTests|FullyQualifiedName~PaidEnrollmentAssessmentAccessTests|FullyQualifiedName~TransactionHistoryTests|FullyQualifiedName~DatabaseStartupTests|FullyQualifiedName~TeacherCourseListTests|FullyQualifiedName~ContentLockMigrationTests|FullyQualifiedName~CommercePaymentTests|FullyQualifiedName~HealthCheckTests"
          - shard: 2
            filter: "FullyQualifiedName~TeacherPracticeCreateWebTests|FullyQualifiedName~CheckoutFlowTests|FullyQualifiedName~AssessmentUiFlowTests|FullyQualifiedName~AssessmentAttemptStartTests|FullyQualifiedName~CourseFeatureTests|FullyQualifiedName~StimulusCreationTests|FullyQualifiedName~TeacherAssessmentPublishTests|FullyQualifiedName~TeacherPracticeIndexViewModelTests|FullyQualifiedName~QuestionCreationServiceTests|FullyQualifiedName~TeacherQuestionBankAuthoringTests|FullyQualifiedName~LandingPageContentTests|FullyQualifiedName~QuestionQueryServiceSearchTests|FullyQualifiedName~CreatePracticeViewModelTests|FullyQualifiedName~QuestionQueryServiceDetailTests|FullyQualifiedName~SecurityConfigurationTests|FullyQualifiedName~AdversarialHttpRoutingTests|FullyQualifiedName~AssessmentCloneTests|FullyQualifiedName~QuestionArchiveTests|FullyQualifiedName~AccountAuthorizationTests|FullyQualifiedName~QuestionContentLockServiceTests|FullyQualifiedName~QuestionBankUiTests"
          - shard: 3
            filter: "FullyQualifiedName~TeacherPracticeIndexControllerTests|FullyQualifiedName~TeacherPracticeIndexWebTests|FullyQualifiedName~AssessmentQueryServiceTests|FullyQualifiedName~CourseCompletionIntegrationTests|FullyQualifiedName~PracticeQuestionValidationTests|FullyQualifiedName~TeacherCourseFinalTests|FullyQualifiedName~TeacherAssessmentQuestionsTests|FullyQualifiedName~TeacherAssessmentDraftTests|FullyQualifiedName~AdminReadOnlyTests|FullyQualifiedName~RoleBasedSmartRoutingTests|FullyQualifiedName~AdversarialRoleLayoutStressTests|FullyQualifiedName~LearningAccessTests|FullyQualifiedName~RoleLayoutIsolationTests|FullyQualifiedName~AdminManagementTests|FullyQualifiedName~LearningDemoSeederTests|FullyQualifiedName~TeacherPracticePreviewTests|FullyQualifiedName~ContentHistoryProtectionTests|FullyQualifiedName~QuestionBankPresentationTests|FullyQualifiedName~AdminDateFilterTests|FullyQualifiedName~QuestionDifficultyMigrationTests|FullyQualifiedName~PracticeVersionMigrationTests|FullyQualifiedName~AdminDashboardAuthorizationTests|FullyQualifiedName~AdminDashboardQueryTests|FullyQualifiedName~AdminOverviewAuthorizationTests|FullyQualifiedName~AdminOverviewDetailTests|FullyQualifiedName~AdminOverviewEmptyTests|FullyQualifiedName~AdminRevenueQueryTests|FullyQualifiedName~AdminRevenueBoundaryTests|FullyQualifiedName~AdminRevenueAuthorizationTests|FullyQualifiedName~AdminRevenueAcceptanceTests"

    # One shared SQL Server for the whole job. DatabaseFixture already supports
    # this: with ELP_TEST_SQLSERVER set, each fixture creates its own randomly
    # named database on this server (and drops it afterwards) instead of
    # starting a separate Testcontainers SQL Server per test class.
    # The password below is a public placeholder for this throwaway CI-only
    # instance; it is the value the security audit allowlists as a placeholder.
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Change_this_password_123!"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Change_this_password_123! -C -Q 'SELECT 1' -b -o /dev/null"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
          --health-start-period 20s

    env:
      ELP_TEST_SQLSERVER: "Server=localhost,1433;User Id=sa;Password=Change_this_password_123!;TrustServerCertificate=True"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore EnglishLearningPlatform.sln

      - name: Build solution
        run: dotnet build EnglishLearningPlatform.sln --configuration Release --no-restore

      # Tests still run sequentially inside one shard (low-memory.runsettings)
      # so a single runner never hosts more than one test app at a time;
      # the parallelism comes from the three shard jobs on separate runners.
      - name: Run integration tests (shard ${{ matrix.shard }})
        run: >
          dotnet test
          tests/EnglishLearningPlatform.IntegrationTests/EnglishLearningPlatform.IntegrationTests.csproj
          --configuration Release
          --no-build
          --settings tests/low-memory.runsettings
          --filter "${{ matrix.filter }}"
          --logger "trx;LogFileName=integration-tests-shard-${{ matrix.shard }}.trx"
          --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-integration-shard-${{ matrix.shard }}
          path: |
            TestResults/*.trx
          if-no-files-found: ignore
