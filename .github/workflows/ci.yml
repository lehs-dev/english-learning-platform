name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore EnglishLearningPlatform.sln

      - name: Build solution
        run: dotnet build EnglishLearningPlatform.sln --configuration Release --no-restore

      - name: Run unit tests
        run: >
          dotnet test
          tests/EnglishLearningPlatform.UnitTests/EnglishLearningPlatform.UnitTests.csproj
          --configuration Release
          --no-build
          --logger "trx;LogFileName=unit-tests.trx"
          --results-directory TestResults

      - name: Run integration tests
        run: >
          dotnet test
          tests/EnglishLearningPlatform.IntegrationTests/EnglishLearningPlatform.IntegrationTests.csproj
          --configuration Release
          --no-build
          --logger "trx;LogFileName=integration-tests.trx"
          --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/*.trx
          if-no-files-found: ignore