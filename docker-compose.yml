services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in environment or local .env}"
    ports:
      - "127.0.0.1:${ELP_SQL_PORT:-1433}:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "SQLCMDPASSWORD=\"$$MSSQL_SA_PASSWORD\" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -b -Q 'SELECT 1' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  migrate:
    image: english-learning-platform:${ELP_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        ELP_CANDIDATE_SHA: "${ELP_CANDIDATE_SHA:-development}"
    command: ["--migrate"]
    environment:
      ConnectionStrings__DefaultConnection: "Server=db,1433;Database=EnglishLearningDb;User Id=sa;Password=${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD};TrustServerCertificate=True;MultipleActiveResultSets=true"
    depends_on:
      db:
        condition: service_healthy

  web:
    image: english-learning-platform:${ELP_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        ELP_CANDIDATE_SHA: "${ELP_CANDIDATE_SHA:-development}"
    environment:
      ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT:-Development}"
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Server=db,1433;Database=EnglishLearningDb;User Id=sa;Password=${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD};TrustServerCertificate=True;MultipleActiveResultSets=true"
      LearningDemo__Enabled: "${LearningDemo__Enabled:-false}"
      LearningDemo__Password: "${LearningDemo__Password:-}"
      Payments__Enabled: "${Payments__Enabled:-false}"
      Vnpay__Enabled: "${Vnpay__Enabled:-false}"
      Vnpay__UseIpn: "${Vnpay__UseIpn:-false}"
      Vnpay__TmnCode: "${Vnpay__TmnCode:-}"
      Vnpay__HashSecret: "${Vnpay__HashSecret:-}"
      Vnpay__PublicBaseUrl: "${Vnpay__PublicBaseUrl:-}"
      Vnpay__CheckoutMinutes: "${Vnpay__CheckoutMinutes:-15}"
      Vnpay__BrowserBaseUrls__0: "${Vnpay__BrowserBaseUrls__0:-http://localhost:8080}"
      Vnpay__BrowserBaseUrls__1: "${Vnpay__BrowserBaseUrls__1:-http://127.0.0.1:8080}"
      CheckoutSandbox__Enabled: "${CheckoutSandbox__Enabled:-false}"
    volumes:
      - stimulus-audio-data:/app/App_Data/stimulus-audio
      - avatar-data:/app/App_Data/avatars
      - data-protection-keys:/home/app/.aspnet/DataProtection-Keys
    ports:
      - "127.0.0.1:${ELP_WEB_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  sqlserver-data:
  stimulus-audio-data:
  avatar-data:
  data-protection-keys:
